name: Build & Release APK (OTA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute-version:
    name: Compute Next Version (+0.1)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Calculate Next Version (+0.1 from latest release)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "")
          echo "Latest release tag: '$LATEST_TAG'"
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VER="${MAJOR}.${NEXT_MINOR}.0"
          else
            NEXT_VER="8.4.0"
          fi
          echo "Computed next version: $NEXT_VER"
          echo "version=$NEXT_VER" >> $GITHUB_OUTPUT
          echo "tag=v${NEXT_VER}-b${{ github.run_number }}" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android APK (arm64)
    needs: compute-version
    runs-on: ubuntu-latest
    env:
      MOCHY_APP_VERSION: ${{ needs.compute-version.outputs.version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Signing Keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release-key.jks
          echo "RELEASE_STORE_FILE=release-key.jks" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=mochymusic_vi_key" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=mochy_vi" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=mochymusic_vi_key" >> $GITHUB_ENV

      - name: Build Signed Arm64 Release APK
        run: |
          if ! curl -fsSLI --connect-timeout 5 --max-time 10 https://services.gradle.org/distributions/gradle-9.3.1-bin.zip >/dev/null 2>&1; then
            echo "services.gradle.org is returning 504/timeout, switching to mirror..."
            sed -i 's|https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip|https\\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip|g' gradle/wrapper/gradle-wrapper.properties
            sed -i 's|validateDistributionUrl=true|validateDistributionUrl=false|g' gradle/wrapper/gradle-wrapper.properties
            sed -i 's|networkTimeout=10000|networkTimeout=60000|g' gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x gradlew
          ./gradlew assembleArm64Release -PenableApkSplits=true --no-daemon --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" "dist/Mochy-Music-vi-arm64-release.apk"

      - name: Publish GitHub Release (OTA Ready)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          name: "Mochy Music v${{ needs.compute-version.outputs.version }} (Build ${{ github.run_number }}) - Bản Việt Hóa"
          body: |
            ### 🇻🇳 Mochy Music — Bản Việt Hóa Toàn Diện (`v${{ needs.compute-version.outputs.version }}` - Build `#${{ github.run_number }}`)
            - **Phiên bản:** `v${{ needs.compute-version.outputs.version }}` (`versionCode: ${{ github.run_number }}`) — Tự động tăng `+0.1` mỗi bản phát hành.
            - **Việt hóa 100% toàn diện:** Đã dịch toàn bộ tệp ngôn ngữ XML (`values-vi`, `values-vi-rVN`) và toàn bộ giao diện Kotlin Compose (Màn hình Chào mừng, Thiết lập ban đầu, Nhập nhạc, Hồ sơ & Thẻ ID, Trang chủ, Trình phát nhạc, Lời bài hát, Thư viện, Audio Lab, Equalizer, Cài đặt).
            - **Ngôn ngữ mặc định:** Tự động nhận diện theo ngôn ngữ thiết bị của bạn (`SYSTEM_DEFAULT`).
            - **Hỗ trợ Cập nhật tự động (OTA) & Cài đè:** Được ký bằng chứng chỉ cố định giúp bạn cài đè trực tiếp hoặc cập nhật ngay trong ứng dụng mà không mất dữ liệu.
            - **Giấy phép & Tác giả:** Mã nguồn mở theo giấy phép **GPL-3.0**, phát triển gốc bởi **@realidkroo (mochy / DH P ASHOKAN)**, **@realkeichi**, **T-Boyke** (kế thừa từ **ViviMusic** của **@vivizzz007** & **Metrolist** của **@mostafaalagamy**). Bản tùy biến & Việt hóa bởi **@buiduchuy2010qn-prog**.
          files: dist/Mochy-Music-vi-arm64-release.apk
          draft: false
          prerelease: false