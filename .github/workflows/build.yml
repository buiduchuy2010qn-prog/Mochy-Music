name: CI & Vietnamese APK Build

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'master' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Mochy Music (Tiếng Việt)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Arm64 Release & Debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew assembleArm64GmsRelease assembleArm64GmsDebug --no-configuration-cache --console=plain --warning-mode summary
          mkdir -p dist
          cp app/build/outputs/apk/arm64Gms/release/*.apk dist/Mochy-Music-vi-arm64-release.apk
          cp app/build/outputs/apk/arm64Gms/debug/*.apk dist/Mochy-Music-vi-arm64-debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-Vietnamese-APKs
          path: dist/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v8.3.2-vi"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "Mochy Music v8.3.2 (Bản Việt Hóa 100%)" \
              --notes "Bản Việt hóa đầy đủ 100% toàn bộ 12 tệp ngôn ngữ cho Mochy Music (giữ nguyên độ nhẹ & giao diện gốc).

          - **Mochy-Music-vi-arm64-release.apk**: Bản chính thức (Release) đã tối ưu R8, siêu nhẹ và mượt.
          - **Mochy-Music-vi-arm64-debug.apk**: Bản cài đặt song song (Debug) nếu bạn muốn giữ cả bản gốc trên máy."
          fi
