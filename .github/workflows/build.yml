name: Build & Release APK + Windows + Linux (OTA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Tiếng Việt + OTA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Persistent Signing Keystore (for OTA & In-place Upgrade)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/raw.p12
            openssl pkcs12 -in ~/.android/raw.p12 -passin pass:android -nodes -out ~/.android/tmp.pem
            openssl pkcs12 -export -in ~/.android/tmp.pem -out ~/.android/debug.keystore -passout pass:android -name androiddebugkey
            rm -f ~/.android/raw.p12 ~/.android/tmp.pem
            echo "Restored persistent signing keystore with alias androiddebugkey."
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Arm64 Release APK & Versioned Artifact
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-10}
          STEP=$(( RUN_NUM > 10 ? RUN_NUM - 10 : 2 ))
          TENTHS=$(( 83 + STEP ))
          APP_VER="$(( TENTHS / 10 )).$(( TENTHS % 10 )).0"
          export MOCHY_APP_VERSION="$APP_VER"
          ./gradlew assembleArm64GmsRelease --no-daemon
          mkdir -p dist-android
          REL_APK=$(find app/build/outputs/apk -name "*arm64*release*.apk" | head -n 1)
          cp "$REL_APK" "dist-android/Mochy-Music-v${APP_VER}-vi-arm64.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*.apk

  build-windows:
    name: Build Windows EXE (Setup & Portable + OTA)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Version, Icon & Build Windows EXE
        shell: pwsh
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $runNum = [int]$env:GITHUB_RUN_NUMBER
          $step = [Math]::Max(2, $runNum - 10)
          $tenths = 83 + $step
          $appVer = "$([Math]::Floor($tenths / 10)).$($tenths % 10).0"
          $buildNum = 1228 + $runNum

          New-Item -ItemType Directory -Force -Path desktop/build | Out-Null
          Copy-Item app/src/main/ic_launcher-playstore.png desktop/build/icon.png -Force

          $pkgPath = "desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $appVer
          $pkg.buildNumber = "$buildNum"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding UTF8

          Push-Location desktop
          $env:ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
          npm install --no-audit --no-fund --ignore-scripts
          npx electron-builder --win nsis portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Retrying Windows build with ELECTRON_MIRROR..."
            $env:ELECTRON_MIRROR = "https://npmmirror.com/mirrors/electron/"
            npx electron-builder --win nsis portable --x64 --publish never
          }
          Pop-Location

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe

  build-linux:
    name: Build Linux (AppImage & DEB + OTA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Version, Icon & Build Linux Packages
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-10}
          STEP=$(( RUN_NUM > 10 ? RUN_NUM - 10 : 2 ))
          TENTHS=$(( 83 + STEP ))
          APP_VER="$(( TENTHS / 10 )).$(( TENTHS % 10 )).0"
          BUILD_NUM=$(( 1228 + RUN_NUM ))

          mkdir -p desktop/build
          cp app/src/main/ic_launcher-playstore.png desktop/build/icon.png

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('desktop/package.json', 'utf8'));
            p.version = '$APP_VER';
            p.buildNumber = '$BUILD_NUM';
            fs.writeFileSync('desktop/package.json', JSON.stringify(p, null, 2));
          "

          cd desktop
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --no-audit --no-fund --ignore-scripts
          npx electron-builder --linux AppImage deb --x64 --publish never || \
            ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/" npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  publish-android-ota:
    name: Publish Android APK OTA (independent)
    runs-on: ubuntu-latest
    needs: [build-android]
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-android

      - name: Publish Android OTA Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-10}
          STEP=$(( RUN_NUM > 10 ? RUN_NUM - 10 : 2 ))
          TENTHS=$(( 83 + STEP ))
          APP_VER="$(( TENTHS / 10 )).$(( TENTHS % 10 )).0"
          BUILD_NUM=$(( 1228 + RUN_NUM ))
          TAG="v${APP_VER}-b${BUILD_NUM}"
          TITLE="Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Android OTA (Bản Việt Hóa)"

          cat <<EOF > release_notes.md
          ### 📱 Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Android OTA

          - **Phiên bản:** `v${APP_VER}` (build#${BUILD_NUM})
          - **Nền tảng:** Android ARM64
          - **Cập nhật OTA:** Tải và cài đè trực tiếp từ ứng dụng Mochy Music.
          - **Tệp APK:** `Mochy-Music-v${APP_VER}-vi-arm64.apk`
          - Bản phát hành Android được tạo độc lập; lỗi build Windows hoặc Linux không chặn OTA Android.

          ---
          **Việt hóa & phát triển:** [buiduchuy2010qn-prog](https://github.com/buiduchuy2010qn-prog)
          **Mã nguồn:** [Mochy-Music](https://github.com/${{ github.repository }})
          **Giấy phép:** GPL-3.0
          EOF
          sed -i 's/^          //' release_notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-android/*.apk --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes-file release_notes.md --latest
          else
            gh release create "$TAG" dist-android/*.apk \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi

  publish-release:
    name: Publish Unified OTA Release (Android, Windows, Linux)
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release (OTA + Multi-Platform)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-10}
          STEP=$(( RUN_NUM > 10 ? RUN_NUM - 10 : 2 ))
          TENTHS=$(( 83 + STEP ))
          APP_VER="$(( TENTHS / 10 )).$(( TENTHS % 10 )).0"
          BUILD_NUM=$(( 1228 + RUN_NUM ))
          TAG="v${APP_VER}-b${BUILD_NUM}"
          TITLE="Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Bản Việt Hóa Toàn Diện (Android • Windows • Linux)"

          cat <<EOF > release_notes.md
          ### 🎵 Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Bản Việt Hóa 100% & Đa Nền Tảng (Android • Windows • Linux)

          - **Phiên bản:** \`v${APP_VER} (build#${BUILD_NUM})\` *(Tự động tăng +0.1 mỗi bản phát hành)*
          - **🌟 Người chỉnh sửa & Việt hóa:** **Đức Huy ([@buiduchuy2010qn-prog](https://github.com/buiduchuy2010qn-prog))**
          - **Việt hóa 100% toàn diện:** Hoàn thiện toàn bộ giao diện Tiếng Việt trên cả điện thoại Android và máy tính Windows / Linux, tự động nhận diện ngôn ngữ theo thiết bị.
          - **Nút Chia sẻ bài hát nhanh:** Tích hợp trực tiếp trong menu 3 chấm (\`⋮\`), thanh phát nhạc và mọi danh sách bài hát.
          - **Hỗ trợ Cập nhật tự động (OTA) & Pop-up thông báo khi mở app:** Tự động hiện bảng thông báo bản cập nhật mới đồng bộ giao diện tối (\`Inter\` font) ngay khi vào ứng dụng trên cả **Android**, **Windows** và **Linux**, hỗ trợ cài đè giữ nguyên toàn bộ dữ liệu.

          #### 📥 Tải tệp cài đặt (có ghi rõ số phiên bản \`v${APP_VER}\`):
          1. 📱 **Android (\`.apk\` — arm64):** \`Mochy-Music-v${APP_VER}-vi-arm64.apk\`
          2. 🪟 **Windows Bộ cài đặt (\`.exe\` — Hỗ trợ cài đè OTA):** \`Mochy-Music-v${APP_VER}-Windows-x64-Setup.exe\`
          3. 🪟 **Windows Bản chạy ngay (\`Portable .exe\`):** \`Mochy-Music-v${APP_VER}-Windows-x64-Portable.exe\`
          4. 🐧 **Linux Mọi bản phân phối (\`.AppImage\`):** \`Mochy-Music-v${APP_VER}-Linux-x86_64.AppImage\`
          5. 🐧 **Ubuntu / Debian / Linux Mint (\`.deb\`):** \`Mochy-Music-v${APP_VER}-Linux-amd64.deb\`

          ---
          #### 📜 Bản quyền & Tác giả (GPL-3.0)
          - **Người chỉnh sửa, Việt hóa & Phát triển OTA:** **Đức Huy ([@buiduchuy2010qn-prog](https://github.com/buiduchuy2010qn-prog/Mochy-Music))**
          - **Tác giả gốc (Original Authors):** [@realidkroo (mochyDH P ASHOKAN)](https://github.com/realidkroo), [@realkeichi (key)](https://github.com/realkeichi)
          - **Dự án nền tảng (Upstream):** ViviMusic (\`@vivizzz007\`) & Metrolist (\`@mostafaalagamy\`)
          - **Giấy phép:** [GNU General Public License v3.0 (GPL-3.0)](https://github.com/buiduchuy2010qn-prog/Mochy-Music/blob/main/LICENSE)
          EOF

          sed -i 's/^          //' release_notes.md

          # Android OTA job creates the release first. This job only adds the
          # desktop packages after Windows and Linux have both built successfully.
          gh release upload "$TAG" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --latest