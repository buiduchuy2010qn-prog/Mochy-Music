name: Build & Release APK + Windows + Linux (OTA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-changes:
    name: Detect Platform Changes (Android vs PC)
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.diff.outputs.android_changed }}
      desktop_changed: ${{ steps.diff.outputs.desktop_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Changed Files
        id: diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(app/|gradle/|build\.gradle|settings\.gradle|all)'; then
            echo "android_changed=true" >> $GITHUB_OUTPUT
          else
            echo "android_changed=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE '^(desktop/|all)'; then
            echo "desktop_changed=true" >> $GITHUB_OUTPUT
          else
            echo "desktop_changed=false" >> $GITHUB_OUTPUT
          fi

  build-android:
    name: Build Android APK (Tiếng Việt + OTA)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Persistent Signing Keystore (for OTA & In-place Upgrade)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/raw.p12
            openssl pkcs12 -in ~/.android/raw.p12 -passin pass:android -nodes -out ~/.android/tmp.pem
            openssl pkcs12 -export -in ~/.android/tmp.pem -out ~/.android/debug.keystore -passout pass:android -name androiddebugkey
            rm -f ~/.android/raw.p12 ~/.android/tmp.pem
            echo "Restored persistent signing keystore with alias androiddebugkey."
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Arm64 Release APK & Versioned Artifact
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-17}
          STEP=$(( RUN_NUM > 10 ? RUN_NUM - 10 : 7 ))
          TENTHS=$(( 83 + STEP ))
          APP_VER="$(( TENTHS / 10 )).$(( TENTHS % 10 )).0"
          BUILD_NUM=$(( 1228 + RUN_NUM ))
          export MOCHY_APP_VERSION="$APP_VER"
          ./gradlew assembleArm64GmsRelease -PmochyAppVersion="$APP_VER" -PmochyBuildNumber="$BUILD_NUM" --no-configuration-cache --no-daemon
          mkdir -p dist-android
          REL_APK=$(find app/build/outputs/apk -name "*arm64*release*.apk" | head -n 1)
          cp "$REL_APK" "dist-android/Mochy-Music-v${APP_VER}-vi-arm64.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*.apk

  build-windows:
    name: Build Windows EXE (Setup & Portable + OTA)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.desktop_changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Version, Icon & Build Windows EXE
        shell: pwsh
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $runNum = [int]$env:GITHUB_RUN_NUMBER
          $step = [Math]::Max(2, $runNum - 10)
          $tenths = 83 + $step
          $appVer = "$([Math]::Floor($tenths / 10)).$($tenths % 10).0"
          $buildNum = 1228 + $runNum

          New-Item -ItemType Directory -Force -Path desktop/build | Out-Null
          Copy-Item app/src/main/ic_launcher-playstore.png desktop/build/icon.png -Force

          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('desktop/package.json', 'utf8').replace(/^\uFEFF/, '');
            const p = JSON.parse(raw);
            p.version = '$appVer';
            p.buildNumber = '$buildNum';
            fs.writeFileSync('desktop/package.json', JSON.stringify(p, null, 2), 'utf8');
          "

          Push-Location desktop
          $env:ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
          $env:ELECTRON_MIRROR = "https://npmmirror.com/mirrors/electron/"
          $env:ELECTRON_BUILDER_BINARIES_MIRROR = "https://npmmirror.com/mirrors/electron-builder-binaries/"
          npm install --no-audit --no-fund --ignore-scripts
          npx electron-builder --win nsis portable --x64 --publish never
          Pop-Location

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe

  build-linux:
    name: Build Linux (AppImage & DEB + OTA)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.desktop_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Version, Icon & Build Linux Packages
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-10}
          STEP=$(( RUN_NUM > 10 ? RUN_NUM - 10 : 2 ))
          TENTHS=$(( 83 + STEP ))
          APP_VER="$(( TENTHS / 10 )).$(( TENTHS % 10 )).0"
          BUILD_NUM=$(( 1228 + RUN_NUM ))

          mkdir -p desktop/build
          cp app/src/main/ic_launcher-playstore.png desktop/build/icon.png

          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('desktop/package.json', 'utf8').replace(/^\uFEFF/, '');
            const p = JSON.parse(raw);
            p.version = '$APP_VER';
            p.buildNumber = '$BUILD_NUM';
            fs.writeFileSync('desktop/package.json', JSON.stringify(p, null, 2), 'utf8');
          "

          cd desktop
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --no-audit --no-fund --ignore-scripts
          ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/" \
          ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/" \
          npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  publish-release:
    name: Publish Unified OTA Release (Android, Windows, Linux)
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release (OTA + Multi-Platform)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-17}
          STEP=$(( RUN_NUM > 10 ? RUN_NUM - 10 : 7 ))
          TENTHS=$(( 83 + STEP ))
          APP_VER="$(( TENTHS / 10 )).$(( TENTHS % 10 )).0"
          BUILD_NUM=$(( 1228 + RUN_NUM ))
          TAG="v${APP_VER}-b${BUILD_NUM}"
          TITLE="Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Bản Việt Hóa Toàn Diện (Android • Windows • Linux)"

          # If Android was not built in this run (PC-only commit), keep the previous APK with its ORIGINAL filename
          if ! ls release-assets/*.apk >/dev/null 2>&1; then
            mkdir -p tmp-prev-apk
            if gh release download --repo "${{ github.repository }}" --pattern "*.apk" --dir tmp-prev-apk >/dev/null 2>&1; then
              PREV_APK=$(ls tmp-prev-apk/*.apk | head -n 1)
              cp "$PREV_APK" "release-assets/$(basename "$PREV_APK")"
            fi
          fi

          # If Desktop was not built in this run (Android-only commit), keep the previous PC installers with their ORIGINAL filenames
          if ! ls release-assets/*.exe >/dev/null 2>&1; then
            mkdir -p tmp-prev-pc
            if gh release download --repo "${{ github.repository }}" --pattern "*.exe" --pattern "*.AppImage" --pattern "*.deb" --dir tmp-prev-pc >/dev/null 2>&1; then
              for f in tmp-prev-pc/*; do
                [ -e "$f" ] && cp "$f" "release-assets/$(basename "$f")"
              done
            fi
          fi

          APK_FILE=$(ls release-assets/*.apk 2>/dev/null | xargs -n 1 basename | head -n 1)
          APK_FILE=${APK_FILE:-Mochy-Music-v${APP_VER}-vi-arm64.apk}
          WIN_SETUP_FILE=$(ls release-assets/*Setup*.exe 2>/dev/null | xargs -n 1 basename | head -n 1)
          WIN_SETUP_FILE=${WIN_SETUP_FILE:-Mochy-Music-v${APP_VER}-Windows-x64-Setup.exe}
          WIN_PORT_FILE=$(ls release-assets/*Portable*.exe 2>/dev/null | xargs -n 1 basename | head -n 1)
          WIN_PORT_FILE=${WIN_PORT_FILE:-Mochy-Music-v${APP_VER}-Windows-x64-Portable.exe}
          LIN_APPIMAGE_FILE=$(ls release-assets/*.AppImage 2>/dev/null | xargs -n 1 basename | head -n 1)
          LIN_APPIMAGE_FILE=${LIN_APPIMAGE_FILE:-Mochy-Music-v${APP_VER}-Linux-x86_64.AppImage}
          LIN_DEB_FILE=$(ls release-assets/*.deb 2>/dev/null | xargs -n 1 basename | head -n 1)
          LIN_DEB_FILE=${LIN_DEB_FILE:-Mochy-Music-v${APP_VER}-Linux-amd64.deb}

          cat <<EOF > release_notes.md
          ### 🎵 Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Bản Việt Hóa 100%

          - **Phiên bản mới:** **v${APP_VER} (build#${BUILD_NUM})**
          - **Người chỉnh sửa & Việt hóa:** **Đức Huy ([@buiduchuy2010qn-prog](https://github.com/buiduchuy2010qn-prog))**
          - **Đồng bộ 100% Font chữ Inter & Giao diện gốc:** Toàn bộ mô tả bản cập nhật, hộp thoại thông báo OTA, thẻ thông tin và trình phát nhạc đều đồng bộ font chữ **Inter** rõ nét, cỡ chữ lớn dễ đọc và hiệu ứng kính mờ chuẩn của ứng dụng.
          - **Nút tắt/bật nhanh Ảnh bìa động (Canvas) & Video nền:** Tích hợp công tắc bật/tắt nhanh ngay trong **menu 3 chấm (⋯)** của màn hình phát nhạc và trong **Cài đặt**.
          - **Sửa lỗi nhận diện phiên bản OTA độc lập từng nền tảng:** Kiểm tra phiên bản trực tiếp theo tệp cài đặt riêng của từng hệ điều hành (.apk trên Android, .exe trên Windows, .AppImage/.deb trên Linux), đảm bảo khi cập nhật riêng một bản thì bản kia không báo cập nhật nhầm.

          #### 📥 Danh sách tệp cài đặt chính thức:
          1. 📱 **Android (APK arm64 — Hỗ trợ cài đè OTA):** **${APK_FILE}**
          2. 🪟 **Windows Bộ cài đặt (.exe — Hỗ trợ cài đè OTA):** **${WIN_SETUP_FILE}**
          3. 🪟 **Windows Bản chạy ngay (Portable .exe):** **${WIN_PORT_FILE}**
          4. 🐧 **Linux Mọi bản phân phối (.AppImage):** **${LIN_APPIMAGE_FILE}**
          5. 🐧 **Ubuntu / Debian / Linux Mint (.deb):** **${LIN_DEB_FILE}**

          ---
          #### 📜 Bản quyền & Tác giả (GPL-3.0)
          - **Người chỉnh sửa, Việt hóa & Phát triển OTA:** **Đức Huy ([@buiduchuy2010qn-prog](https://github.com/buiduchuy2010qn-prog/Mochy-Music))**
          - **Tác giả gốc (Original Authors):** [@realidkroo (mochyDH P ASHOKAN)](https://github.com/realidkroo), [@realkeichi (key)](https://github.com/realkeichi)
          - **Dự án nền tảng (Upstream):** ViviMusic (@vivizzz007) & Metrolist (@mostafaalagamy)
          - **Giấy phép:** [GNU General Public License v3.0 (GPL-3.0)](https://github.com/buiduchuy2010qn-prog/Mochy-Music/blob/main/LICENSE)
          EOF

          sed -i 's/^          //' release_notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          else
            gh release create "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi
