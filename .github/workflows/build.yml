name: Build & Release APK + Windows + Linux (OTA)

# How releases work now:
# - Every push to main builds the platforms it touched, as a compile check. Nothing is published,
#   so phones and PCs are not asked to update after every commit.
# - A release is published when the version in the VERSION file (e.g. 9.9.0) differs from the
#   newest v* tag, or when the workflow is started by hand (workflow_dispatch).
# - A release rebuilds only the platforms changed since the last release; the other platform keeps
#   its previous installer (with its own version in the file name), so it is not asked to update.
# - The release notes list the commits since the last release, grouped by type.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Release & Platform Changes
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.diff.outputs.android_changed }}
      desktop_changed: ${{ steps.diff.outputs.desktop_changed }}
      release: ${{ steps.diff.outputs.release }}
      app_ver: ${{ steps.diff.outputs.app_ver }}
      build_num: ${{ steps.diff.outputs.build_num }}
      last_tag: ${{ steps.diff.outputs.last_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide Release & Changed Platforms
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          LAST_VER=$(echo "$LAST_TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          APP_VER=$(tr -d ' \r\n' < VERSION)
          BUILD_NUM=$(( 1228 + GITHUB_RUN_NUMBER ))
          if ! echo "$APP_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must look like 9.9.0, got '$APP_VER'"; exit 1
          fi

          RELEASE=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$APP_VER" != "$LAST_VER" ]; then
            RELEASE=true
          fi

          # a release compares with the last release; a plain push only with what it pushed
          if [ "$RELEASE" = "true" ]; then BASE="$LAST_TAG"; else BASE="$BEFORE_SHA"; fi
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD)
          else
            CHANGED="all"
          fi
          echo "Last tag: ${LAST_TAG:-none} ($LAST_VER) | VERSION: $APP_VER | release: $RELEASE"
          echo "Changed files since ${BASE:-start}:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(app/|gradle/|build\.gradle|settings\.gradle|all$)'; then
            echo "android_changed=true" >> $GITHUB_OUTPUT
          else
            echo "android_changed=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE '^(desktop/|all$)'; then
            echo "desktop_changed=true" >> $GITHUB_OUTPUT
          else
            echo "desktop_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android APK (Tiếng Việt + OTA)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Persistent Signing Keystore (for OTA & In-place Upgrade)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: SIGNING_KEYSTORE_BASE64 secret is missing! Refusing to generate a random key that would break in-place OTA upgrades."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/raw.p12
          openssl pkcs12 -in ~/.android/raw.p12 -passin pass:android -nodes -out ~/.android/tmp.pem
          openssl pkcs12 -export -in ~/.android/tmp.pem -out ~/.android/debug.keystore -passout pass:android -name androiddebugkey
          rm -f ~/.android/raw.p12 ~/.android/tmp.pem
          if [ ! -s ~/.android/debug.keystore ]; then
            echo "ERROR: Restored keystore is empty or invalid!"
            exit 1
          fi
          echo "Restored persistent signing keystore with alias androiddebugkey."

      - name: Build Arm64 Release APK & Versioned Artifact
        env:
          APP_VER: ${{ needs.detect-changes.outputs.app_ver }}
          BUILD_NUM: ${{ needs.detect-changes.outputs.build_num }}
        run: |
          export MOCHY_APP_VERSION="$APP_VER"
          ./gradlew assembleArm64GmsRelease -PmochyAppVersion="$APP_VER" -PmochyBuildNumber="$BUILD_NUM" --no-configuration-cache --no-daemon
          mkdir -p dist-android
          REL_APK=$(find app/build/outputs/apk -name "*arm64*release*.apk" | head -n 1)
          cp "$REL_APK" "dist-android/Mochy-Music-v${APP_VER}-vi-arm64.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*.apk
          retention-days: 14

  build-windows:
    name: Build Windows EXE (Setup & Portable + OTA)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.desktop_changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Version, Icon & Build Windows EXE
        shell: pwsh
        env:
          APP_VER: ${{ needs.detect-changes.outputs.app_ver }}
          BUILD_NUM: ${{ needs.detect-changes.outputs.build_num }}
        run: |
          $appVer = $env:APP_VER
          $buildNum = $env:BUILD_NUM

          New-Item -ItemType Directory -Force -Path desktop/build | Out-Null
          Copy-Item app/src/main/ic_launcher-playstore.png desktop/build/icon.png -Force

          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('desktop/package.json', 'utf8').replace(/^\uFEFF/, '');
            const p = JSON.parse(raw);
            p.version = '$appVer';
            p.buildNumber = '$buildNum';
            fs.writeFileSync('desktop/package.json', JSON.stringify(p, null, 2), 'utf8');
          "

          Push-Location desktop
          $env:ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
          $env:ELECTRON_MIRROR = "https://npmmirror.com/mirrors/electron/"
          $env:ELECTRON_BUILDER_BINARIES_MIRROR = "https://npmmirror.com/mirrors/electron-builder-binaries/"
          npm install --no-audit --no-fund --ignore-scripts
          npx electron-builder --win nsis portable --x64 --publish never
          Pop-Location

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe
          retention-days: 14

  build-linux:
    name: Build Linux (AppImage & DEB + OTA)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.desktop_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Version, Icon & Build Linux Packages
        env:
          APP_VER: ${{ needs.detect-changes.outputs.app_ver }}
          BUILD_NUM: ${{ needs.detect-changes.outputs.build_num }}
        run: |
          mkdir -p desktop/build
          cp app/src/main/ic_launcher-playstore.png desktop/build/icon.png

          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('desktop/package.json', 'utf8').replace(/^\uFEFF/, '');
            const p = JSON.parse(raw);
            p.version = '$APP_VER';
            p.buildNumber = '$BUILD_NUM';
            fs.writeFileSync('desktop/package.json', JSON.stringify(p, null, 2), 'utf8');
          "

          cd desktop
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install --no-audit --no-fund --ignore-scripts
          ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/" \
          ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/" \
          npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          retention-days: 14

  publish-release:
    name: Publish Unified OTA Release (Android, Windows, Linux)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-android, build-windows, build-linux]
    if: >-
      always() &&
      needs.detect-changes.outputs.release == 'true' &&
      needs.build-android.result != 'failure' && needs.build-windows.result != 'failure' && needs.build-linux.result != 'failure' &&
      (needs.build-android.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    steps:
      - name: Checkout Repository (for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release (OTA + Multi-Platform)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VER: ${{ needs.detect-changes.outputs.app_ver }}
          BUILD_NUM: ${{ needs.detect-changes.outputs.build_num }}
          LAST_TAG: ${{ needs.detect-changes.outputs.last_tag }}
          ANDROID_BUILT: ${{ needs.build-android.result == 'success' }}
          DESKTOP_BUILT: ${{ needs.build-windows.result == 'success' }}
        run: |
          TAG="v${APP_VER}-b${BUILD_NUM}"
          TITLE="Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Bản Việt Hóa Toàn Diện (Android • Windows • Linux)"

          # If Android was not built in this run (PC-only release), keep the previous APK with its ORIGINAL filename
          if ! ls release-assets/*.apk >/dev/null 2>&1; then
            mkdir -p tmp-prev-apk
            if gh release download --repo "${{ github.repository }}" --pattern "*.apk" --dir tmp-prev-apk >/dev/null 2>&1; then
              PREV_APK=$(ls tmp-prev-apk/*.apk | head -n 1)
              cp "$PREV_APK" "release-assets/$(basename "$PREV_APK")"
            fi
          fi

          # If Desktop was not built in this run (Android-only release), keep the previous PC installers with their ORIGINAL filenames
          if ! ls release-assets/*.exe >/dev/null 2>&1; then
            mkdir -p tmp-prev-pc
            if gh release download --repo "${{ github.repository }}" --pattern "*.exe" --pattern "*.AppImage" --pattern "*.deb" --dir tmp-prev-pc >/dev/null 2>&1; then
              for f in tmp-prev-pc/*; do
                [ -e "$f" ] && cp "$f" "release-assets/$(basename "$f")"
              done
            fi
          fi

          APK_FILE=$(ls release-assets/*.apk 2>/dev/null | xargs -n 1 basename | head -n 1)
          APK_FILE=${APK_FILE:-Mochy-Music-v${APP_VER}-vi-arm64.apk}
          WIN_SETUP_FILE=$(ls release-assets/*Setup*.exe 2>/dev/null | xargs -n 1 basename | head -n 1)
          WIN_SETUP_FILE=${WIN_SETUP_FILE:-Mochy-Music-v${APP_VER}-Windows-x64-Setup.exe}
          WIN_PORT_FILE=$(ls release-assets/*Portable*.exe 2>/dev/null | xargs -n 1 basename | head -n 1)
          WIN_PORT_FILE=${WIN_PORT_FILE:-Mochy-Music-v${APP_VER}-Windows-x64-Portable.exe}
          LIN_APPIMAGE_FILE=$(ls release-assets/*.AppImage 2>/dev/null | xargs -n 1 basename | head -n 1)
          LIN_APPIMAGE_FILE=${LIN_APPIMAGE_FILE:-Mochy-Music-v${APP_VER}-Linux-x86_64.AppImage}
          LIN_DEB_FILE=$(ls release-assets/*.deb 2>/dev/null | xargs -n 1 basename | head -n 1)
          LIN_DEB_FILE=${LIN_DEB_FILE:-Mochy-Music-v${APP_VER}-Linux-amd64.deb}

          # ---- changelog: the commits since the last release, grouped by their conventional-commit type ----
          if [ -n "$LAST_TAG" ] && git cat-file -e "${LAST_TAG}^{commit}" 2>/dev/null; then
            git log --no-merges --pretty='%s' "${LAST_TAG}..HEAD" > commits.txt
          else
            git log --no-merges --pretty='%s' -n 30 > commits.txt
          fi
          STRIP='s/^[A-Za-z]+(\([^)]*\))?!?:[[:space:]]*//'
          FEAT=$(grep -E '^feat(\([^)]*\))?!?:' commits.txt | sed -E "$STRIP" | sed 's/^/- /' || true)
          FIX=$(grep -E '^fix(\([^)]*\))?!?:' commits.txt | sed -E "$STRIP" | sed 's/^/- /' || true)
          OTHER=$(grep -vE '^(feat|fix|chore|ci|docs|build|style|test)(\([^)]*\))?!?:' commits.txt | grep -vE '^Merge ' | sed -E "$STRIP" | sed 's/^/- /' || true)

          if [ "$ANDROID_BUILT" = "true" ]; then ANDROID_LINE="cập nhật lên **v${APP_VER}**"; else ANDROID_LINE="không đổi trong bản này"; fi
          if [ "$DESKTOP_BUILT" = "true" ]; then DESKTOP_LINE="cập nhật lên **v${APP_VER}**"; else DESKTOP_LINE="không đổi trong bản này"; fi

          {
            echo "### 🎵 Mochy Music v${APP_VER} (build#${BUILD_NUM}) — Bản Việt Hóa 100%"
            echo ""
            echo "- **Phiên bản mới:** **v${APP_VER} (build#${BUILD_NUM})**"
            echo "- 📱 **Android:** ${ANDROID_LINE}"
            echo "- 💻 **Máy tính (Windows / Linux):** ${DESKTOP_LINE}"
            echo ""
            if [ -n "$FEAT" ]; then echo "#### ✨ Tính năng mới"; echo "$FEAT"; echo ""; fi
            if [ -n "$FIX" ]; then echo "#### 🐞 Sửa lỗi"; echo "$FIX"; echo ""; fi
            if [ -n "$OTHER" ]; then echo "#### 🔧 Cải thiện khác"; echo "$OTHER"; echo ""; fi
            echo "#### 📥 Danh sách tệp cài đặt chính thức:"
            echo "1. 📱 **Android (APK arm64 — Hỗ trợ cài đè OTA):** **${APK_FILE}**"
            echo "2. 🪟 **Windows Bộ cài đặt (.exe — Hỗ trợ cài đè OTA):** **${WIN_SETUP_FILE}**"
            echo "3. 🪟 **Windows Bản chạy ngay (Portable .exe):** **${WIN_PORT_FILE}**"
            echo "4. 🐧 **Linux Mọi bản phân phối (.AppImage):** **${LIN_APPIMAGE_FILE}**"
            echo "5. 🐧 **Ubuntu / Debian / Linux Mint (.deb):** **${LIN_DEB_FILE}**"
            echo ""
            echo "---"
            echo "#### 📜 Bản quyền & Tác giả (GPL-3.0)"
            echo "- **Người chỉnh sửa, Việt hóa & Phát triển OTA:** **Đức Huy ([@buiduchuy2010qn-prog](https://github.com/buiduchuy2010qn-prog/Mochy-Music))**"
            echo "- **Tác giả gốc (Original Authors):** [@realidkroo (mochyDH P ASHOKAN)](https://github.com/realidkroo), [@realkeichi (key)](https://github.com/realkeichi)"
            echo "- **Dự án nền tảng (Upstream):** ViviMusic (@vivizzz007) & Metrolist (@mostafaalagamy)"
            echo "- **Giấy phép:** [GNU General Public License v3.0 (GPL-3.0)](https://github.com/buiduchuy2010qn-prog/Mochy-Music/blob/main/LICENSE)"
          } > release_notes.md
          cat release_notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          else
            gh release create "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi
